<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <title>鹈鹕的海风假日 · SVG 动画</title>
  <style>
    :root { color-scheme: light; --ink: #274b49; --muted: #71827b; --paper: #f7f5ee; --accent: #d97552; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 32px 0 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #274b4924; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; letter-spacing: .1em; }
    .brand svg { width: 29px; height: 29px; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: .18em; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 34px 0 26px; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; color: var(--accent); font-weight: 650; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(29px, 4.2vw, 48px); font-weight: 550; line-height: 1.3; letter-spacing: .06em; }
    .intro-copy { margin: 0 0 5px; color: var(--muted); font-size: 13px; line-height: 1.9; text-align: right; }
    .artwork { position: relative; overflow: hidden; border: 1px solid #274b491a; border-radius: 10px; background: #dcebe2; }
    .scene { display: block; width: 100%; height: auto; }
    .art-label { position: absolute; left: 24px; top: 23px; display: flex; align-items: center; gap: 7px; color: #486e62; font-size: 10px; letter-spacing: .15em; pointer-events: none; }
    .art-label::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #668b6d; }
    .coordinates { position: absolute; right: 24px; bottom: 20px; color: #6b7967; font-size: 9px; letter-spacing: .15em; pointer-events: none; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; border-bottom: 1px solid #274b4924; }
    .caption { display: flex; align-items: center; gap: 12px; }
    .caption-number { display: grid; place-items: center; width: 31px; height: 31px; border: 1px solid #274b4929; border-radius: 50%; font-size: 10px; }
    .caption p { margin: 0; font-size: 12px; line-height: 1.7; }
    .caption small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .03em; }
    .controls { display: flex; align-items: center; gap: 20px; }
    .speed-control { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--muted); }
    input[type="range"] { width: 90px; height: 18px; margin: 0; accent-color: #527b69; cursor: pointer; }
    output { min-width: 29px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .toggle { display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 113px; border: 0; border-radius: 5px; padding: 11px 15px; background: var(--ink); color: #fffdf4; font-size: 12px; cursor: pointer; transition: background .2s; }
    .toggle:hover { background: #3e6d61; }
    .toggle svg { width: 13px; height: 13px; }
    .toggle[data-paused="true"] .pause-icon, .toggle[data-paused="false"] .play-icon { display: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 18px; color: #829087; font-size: 9px; letter-spacing: .12em; }
    @media (max-width: 680px) {
      .page { width: calc(100% - 32px); padding-top: 20px; }
      .edition { font-size: 8px; letter-spacing: .08em; }
      .intro { display: block; padding: 27px 0 22px; }
      .intro-copy { margin: 13px 0 0; text-align: left; font-size: 12px; }
      .intro-copy br { display: none; }
      .art-label { top: 13px; left: 13px; font-size: 7px; }
      .coordinates { right: 13px; bottom: 12px; font-size: 6px; }
      .toolbar { flex-wrap: wrap; gap: 18px; }
      .controls { width: 100%; justify-content: space-between; gap: 12px; }
      input[type="range"] { width: 110px; }
      footer { font-size: 8px; letter-spacing: .05em; }
    }
    @media (prefers-reduced-motion: reduce) { .toggle { transition: none; } }
  </style>
</head>
<body>

    <div class="toolbar">

    <noscript><p>启用 JavaScript 即可观看骑行动画；当前显示静态 SVG 插画。</p></noscript>
  </main>

  <script>
    (() => {
      'use strict';
      const element = id => document.getElementById(id);
      const ids = ['rear-spokes', 'front-spokes', 'crank', 'pelican', 'eye', 'scarf-tail',
        'far-leg', 'near-leg', 'far-foot', 'near-foot', 'far-pedal', 'near-pedal',
        'cloud-a', 'cloud-b', 'cloud-c', 'water', 'road-markings', 'dune-grass',
        'foreground', 'bike-shadow', 'breeze-a', 'breeze-b'];
      const parts = Object.fromEntries(ids.map(id => [id, element(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = element('toggle');
      const speedInput = element('speed');
      let paused = motionPreference.matches;
      let speed = Number(speedInput.value);
      let time = 0;
      let previousTime = null;
      let animationId = null;
      const TAU = Math.PI * 2;
      const period = 1.65;
      const wheelRadius = 94;
      const gearing = 1.55;

      function draw(t) {
        const phase = t * TAU / period;
        const bob = Math.sin(phase * 2) * 1.7;
        const wheelAngle = phase * gearing * 180 / Math.PI;
        // Road displacement equals the distance travelled by the turning tires.
        const distance = phase * gearing * wheelRadius;
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts['road-markings'].setAttribute('patternTransform', `translate(${-distance % 270} 0)`);
        parts.water.setAttribute('patternTransform', `translate(${-(distance * .045) % 260} 0)`);
        parts['dune-grass'].setAttribute('transform', `translate(${-(distance * .3) % 1200} 0)`);
        parts.foreground.setAttribute('transform', `translate(${-distance % 1200} 0)`);
        // Each cloud wraps only after it has completely left the viewBox.
        [[180, 9, 'a'], [500, 6, 'b'], [1080, 11, 'c']].forEach(([start, drift, name]) => {
          const x = ((start + 180 - t * drift) % 1560 + 1560) % 1560 - 180;
          parts[`cloud-${name}`].setAttribute('transform', `translate(${x - start} 0)`);
        });
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts['bike-shadow'].setAttribute('rx', 253 + bob * 1.1);
        parts['scarf-tail'].setAttribute('d', `M603 219Q575 ${219 + Math.sin(phase * 2) * 4} 548 ${207 + Math.sin(phase * 2 + 1) * 6}L559 223L543 ${234 + Math.sin(phase * 2 + 1) * 5}Q577 238 611 228Z`);
        const blinkPhase = t % 5.3;
        const eyeScale = blinkPhase > 4.95 && blinkPhase < 5.15
          ? Math.max(.08, Math.abs(blinkPhase - 5.05) / .1) : 1;
        parts.eye.setAttribute('transform', `scale(1 ${eyeScale})`);
        parts['breeze-a'].setAttribute('transform', `translate(${-Math.sin(t * 1.8) * 10} 0)`);
        parts['breeze-b'].setAttribute('opacity', .45 + Math.sin(t * 2) * .25);

        const feet = [0, Math.PI].map(offset => ({
          x: 570 + 33 * Math.cos(phase + offset),
          y: 480 + 33 * Math.sin(phase + offset)
        }));
        parts.crank.setAttribute('d', `M${feet[0].x} ${feet[0].y}L${feet[1].x} ${feet[1].y}`);
        ['near', 'far'].forEach((side, i) => {
          const foot = feet[i];
          const hip = { x: 510 + i * 9, y: 321 + bob };
          // Two-link inverse kinematics keeps both leg lengths fixed through a full turn.
          const ankle = { x: foot.x - 4, y: foot.y - 10 };
          const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
          const length = Math.hypot(dx, dy);
          const thigh = 108, shin = 105;
          const along = (thigh ** 2 - shin ** 2 + length ** 2) / (2 * length);
          const height = Math.sqrt(Math.max(0, thigh ** 2 - along ** 2));
          const knee = {
            x: hip.x + along * dx / length + height * dy / length,
            y: hip.y + along * dy / length - height * dx / length
          };
          parts[`${side}-leg`].setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`);
          parts[`${side}-foot`].setAttribute('d', `M${foot.x - 9} ${foot.y - 14}Q${foot.x} ${foot.y - 9} ${foot.x + 18} ${foot.y - 6}L${foot.x + 22} ${foot.y - 1}H${foot.x - 10}Z`);
          parts[`${side}-pedal`].setAttribute('d', `M${foot.x - 13} ${foot.y + 2}h38`);
        });
      }

      function frame(now) {
        animationId = null;
        if (paused || document.hidden) return;
        if (previousTime !== null) time += Math.min((now - previousTime) / 1000, .05) * speed;
        previousTime = now;
        draw(time);
        animationId = requestAnimationFrame(frame);
      }

      function synchronizePlayback() {
        if (animationId !== null) cancelAnimationFrame(animationId);
        animationId = null;
        previousTime = null;
        const label = paused ? '继续骑行' : '暂停骑行';
        element('toggle-label').textContent = label;
        toggle.dataset.paused = String(paused);
        toggle.setAttribute('aria-pressed', String(paused));
        toggle.setAttribute('aria-label', label);
        element('scene-status').textContent = paused ? '海岸线 · 歇一会儿' : '海岸线 · 正在兜风';
        if (!paused && !document.hidden) animationId = requestAnimationFrame(frame);
      }

      toggle.addEventListener('click', () => { paused = !paused; synchronizePlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        element('speed-value').textContent = `${speed.toFixed(1)}×`;
      });
      motionPreference.addEventListener('change', event => {
        paused = event.matches;
        synchronizePlayback();
      });
      document.addEventListener('visibilitychange', synchronizePlayback);
      // Draw the initial pose before starting the animation clock.
      draw(0);
      synchronizePlayback();
    })();
  </script>
</body>
</html>
